<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daus Tik - TikTok Downloader</title>
    <!-- Ganti favicon.png dengan nama file gambar yang kamu upload -->
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Daus Tik</h1>
        <div class="input-group">
            <input type="text" id="tiktokUrl" placeholder="Tempel link TikTok di sini...">
            <button onclick="pasteLink()">Tempel</button>
            <button onclick="processTikTok()">Cari</button>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Sedang mengambil data...</p>
        </div>

        <div id="result" class="hidden">
            <h3 id="authorName"></h3>
            <p id="videoTitle"></p>
            <div id="mediaArea"></div>
            <div id="actionArea"></div>
        </div>
        <footer>Dibuat oleh Daus Dopo</footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
