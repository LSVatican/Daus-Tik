<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daus Tik</title>
  <!-- Favicon dari URL Gambar -->
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome untuk Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="main-card">
    <h1 class="title"><i class="fa-brands fa-tiktok"></i> Daus Tik</h1>
    <p class="subtitle">Dibuat oleh Daus Dopo</p>

    <div class="input-container">
      <i class="fa-brands fa-tiktok tiktok-icon"></i>
      <input type="text" id="tiktokUrl" placeholder="Tempel tautan TikTok di sini...">
      <button id="pasteBtn" class="btn-paste"><i class="fa-solid fa-paste"></i> Tempel</button>
    </div>

    <p class="instruction-text"><i class="fa-solid fa-circle-info"></i> Berfungsi untuk video & slide foto</p>

    <button id="fetchBtn" class="btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Cari Media</button>

    <!-- Indicator Loading -->
    <div id="loading" class="loading-box hidden">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <span>Mencari thumbnail asli TikTok...</span>
    </div>

    <!-- Preview Media & Actions -->
    <div id="resultContainer" class="result-container hidden">
      <div class="media-preview-wrapper" oncontextmenu="return false;">
        <!-- Single Preview -->
        <div id="singlePreview" class="preview-box"></div>
        
        <!-- Slide Controls & Preview -->
        <div id="slidePreview" class="preview-box hidden">
          <div id="slideContent" class="slide-content"></div>
          <div class="slide-nav">
            <button id="prevBtn" class="btn-nav hidden"><i class="fa-solid fa-chevron-left"></i> Prev</button>
            <span id="slideCounter" class="slide-counter">1/1</span>
            <button id="nextBtn" class="btn-nav hidden">Next <i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
      </div>

      <div class="download-actions">
        <button id="dlNoWm" class="btn-tiktok"><i class="fa-solid fa-download"></i> Download Tanpa Watermark</button>
        <button id="dlWm" class="btn-tiktok"><i class="fa-solid fa-water-lower"></i> Download Dengan Watermark</button>
        <button id="dlMp3" class="btn-tiktok"><i class="fa-solid fa-music"></i> MP3 Only</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
